<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="naver-site-verification" content="178fbfd6826148c63976eac9491a9fe43f89f24d" />
    <!-- 이미지 규칙을 거쳐 해시가 붙은 파일명으로 나가므로, 파비콘을 바꿔도 1년 캐시에 막히지 않는다. -->
    <link rel="icon" type="image/png" href="<%= require('./src/shared/assets/favicon.png') %>" />
    <link rel="apple-touch-icon" href="<%= require('./src/shared/assets/apple-touch-icon.png') %>" />
    <meta
      name="description"
      content="회사나 학교에서 가까운 동네부터 찾아보고, 집을 보러 가면 체크리스트로 꼼꼼히 남겨 두세요. 직접 본 방들은 나란히 놓고 비교할 수 있어요."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="자취선배 | 자취할 동네를 찾고, 본 방은 기록하고 비교해요" />
    <meta
      property="og:description"
      content="회사나 학교에서 가까운 동네부터 찾아보고, 집을 보러 가면 체크리스트로 꼼꼼히 남겨 두세요. 직접 본 방들은 나란히 놓고 비교할 수 있어요."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="자취선배 | 자취할 동네를 찾고, 본 방은 기록하고 비교해요" />
    <meta
      name="twitter:description"
      content="회사나 학교에서 가까운 동네부터 찾아보고, 집을 보러 가면 체크리스트로 꼼꼼히 남겨 두세요. 직접 본 방들은 나란히 놓고 비교할 수 있어요."
    />
    <title>자취선배</title>
    <!--
      JS를 받는 동안 흰 화면 대신 보여 줄 앱 뼈대. React가 처음 그리면 #root 안이 바뀐다.
      홈(`/`)은 실제 첫 화면과 같은 자리와 크기의 카드 뼈대를 두고, 다른 화면은 헤더 자리만 둔다.
      홈 뼈대 마크업은 HomePageSkeleton과 같아야 한다(테스트가 확인한다).
    -->
    <style>
      body {
        margin: 0;
      }
      .boot-skeleton {
        min-height: 100vh;
        min-height: 100dvh;
        background: #fff;
      }
      .boot-skeleton__header {
        height: 54px;
      }
      .boot-skeleton__body {
        display: none;
      }
      .boot-skeleton--home .boot-skeleton__body {
        display: grid;
        box-sizing: border-box;
        max-width: 720px;
        margin: 0 auto;
        padding: 19px 20px 0;
        gap: 22px;
      }
      .boot-skeleton__body span {
        display: block;
        border-radius: 18px;
        background: #f4f5f7;
      }
      .boot-skeleton__body span:nth-child(1) {
        height: 83px;
      }
      .boot-skeleton__body span:nth-child(2) {
        height: 304px;
      }
      .boot-skeleton__body span:nth-child(3) {
        height: 83px;
        margin-top: -11px;
      }
      .boot-skeleton__body span:nth-child(4) {
        height: 102px;
        margin-top: 6px;
      }
      @media (min-width: 1024px) {
        .boot-skeleton__header {
          box-sizing: border-box;
          height: 71px;
          border-bottom: 1px solid #eceef1;
        }
        .boot-skeleton--home .boot-skeleton__body {
          max-width: 1024px;
          padding: 20px 32px 0;
          grid-template-columns: minmax(0, 1fr) 304px;
          column-gap: 32px;
          row-gap: 22px;
        }
        .boot-skeleton__body span:nth-child(n) {
          margin-top: 0;
        }
        .boot-skeleton__body span:nth-child(1) {
          grid-area: 1 / 1;
          height: 99px;
        }
        .boot-skeleton__body span:nth-child(2) {
          grid-area: 2 / 1;
          height: 384px;
        }
        .boot-skeleton__body span:nth-child(3) {
          grid-area: 1 / 2;
          height: 99px;
        }
        .boot-skeleton__body span:nth-child(4) {
          grid-area: 2 / 2;
          height: 210px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-skeleton boot-skeleton--home" role="progressbar" aria-label="화면을 불러오는 중이에요.">
        <div class="boot-skeleton__header"></div>
        <div class="boot-skeleton__body"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>
      if (location.pathname !== '/') document.querySelector('.boot-skeleton').classList.remove('boot-skeleton--home');
    </script>
  </body>
</html>
