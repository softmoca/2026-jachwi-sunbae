import org.gradle.api.tasks.testing.Test

def cacheDirectory = System.getenv('CI_GRADLE_BUILD_CACHE')
if (!cacheDirectory) {
    throw new GradleException('CI_GRADLE_BUILD_CACHE 환경변수가 필요하다.')
}

gradle.settingsEvaluated { settings ->
    settings.buildCache.local.directory = new File(cacheDirectory)
}

gradle.allprojects { project ->
    project.tasks.withType(Test).configureEach { testTask ->
        testTask.outputs.cacheIf { false }
        testTask.outputs.upToDateWhen { false }
        testTask.afterSuite { suite, result ->
            if (!suite.parent) {
                logger.lifecycle("CI_TEST_SUMMARY task=${testTask.path} tests=${result.testCount} failures=${result.failedTestCount} skipped=${result.skippedTestCount}")
            }
        }
    }
}

def taskStarts = [:]
gradle.taskGraph.beforeTask { task ->
    taskStarts[task.path] = System.nanoTime()
}
gradle.taskGraph.afterTask { task, state ->
    def elapsedMillis = (System.nanoTime() - taskStarts.remove(task.path)).intdiv(1_000_000)
    def outcome = state.failure ? 'FAILED' : (state.skipMessage ?: 'EXECUTED')
    logger.lifecycle("CI_TASK ${task.path} elapsed_ms=${elapsedMillis} outcome=${outcome}")
}
