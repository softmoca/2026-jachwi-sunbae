name: Detect frontend changes
description: 프론트엔드 검사가 필요한 변경인지 판정한다. 체크아웃은 fetch-depth 0이어야 한다.

outputs:
  frontend:
    description: 프론트엔드 검사가 필요하면 'true'
    value: ${{ steps.changes.outputs.frontend }}

runs:
  using: composite
  steps:
    - name: Detect frontend changes
      id: changes
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
          echo "frontend=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ "${EVENT_NAME}" == "pull_request" ]]; then
          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
        else
          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
        fi

        if grep -Eq '^(frontend/|\.github/workflows/frontend-ci\.yml$|\.github/actions/(setup-frontend|detect-frontend-changes)/)' <<< "${CHANGED_FILES}"; then
          echo "frontend=true" >> "${GITHUB_OUTPUT}"
        else
          echo "frontend=false" >> "${GITHUB_OUTPUT}"
          echo "프론트엔드 변경이 없어 검사를 생략한다." >> "${GITHUB_STEP_SUMMARY}"
        fi
