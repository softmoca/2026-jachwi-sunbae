name: Backend CD

on:
  # develop 병합 후 배포한다. PR 검사와 별도로 테스트를 반복하지 않는다.
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy lab
    # 개인 Fork의 develop push 또는 개인 브랜치 수동 실행만 배포한다.
    if: >-
      github.repository == 'softmoca/2026-jachwi-sunbae' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 빌드·연결·재시작이 멈춰도 job을 무한히 유지하지 않는다.
    concurrency:
      # 모든 브랜치가 같은 EC2를 사용하므로 동시에 하나만 빌드·배포한다.
      group: jachwi-personal-lab-deploy
      cancel-in-progress: false # 진행 중 배포는 유지한다. 기본 대기 1개는 새 요청으로 대체될 수 있다.
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v6
        with:
          # 이번 배포 대상 SHA로 고정해 같은 커밋의 JAR와 배포 스크립트를 사용한다.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 개인 브랜치에서도 캐시를 저장한다. develop 캐시는 해당 브랜치 대상 PR도 재사용한다.
          cache-read-only: false

      - name: Build lab JAR
        working-directory: backend
        env:
          # 기존 Gradle 설정이 이 값을 JAR의 build.commit에 기록한다.
          SOURCE_COMMIT_ID: ${{ github.sha }}
        run: |
          # 배포 스크립트의 셸 문법을 확인한 뒤 실행 JAR만 만든다.
          bash -n lab/deploy.sh
          # bootJar는 테스트를 실행하지 않는다. 같은 runner에서 바로 전송한다.
          ./gradlew clean bootJar --no-daemon --build-cache --console=plain

      - name: Prepare deployment files
        env:
          LAB_SSH_FINGERPRINT: ${{ secrets.LAB_SSH_FINGERPRINT }}
        run: |
          # fingerprint 미설정 시 Action의 서버 신원 확인이 생략되지 않도록 중단한다.
          [[ -n "$LAB_SSH_FINGERPRINT" ]] || { echo 'Set LAB_SSH_FINGERPRINT first.'; exit 1; }
          jars=(backend/build/libs/*.jar)
          [[ ${#jars[@]} -eq 1 && -f ${jars[0]} ]] || exit 1
          mkdir -p lab-upload
          # 기존 deploy.sh가 기대하는 실행·시도별 JAR 이름으로 준비한다.
          cp "${jars[0]}" "lab-upload/jachwi-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jar"
          cp backend/lab/deploy.sh "lab-upload/jachwi-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"

      - name: Upload JAR and deploy script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LAB_SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.LAB_SSH_FINGERPRINT }}
          source: "lab-upload/*"
          target: /home/ec2-user
          strip_components: 1 # lab-upload/를 제거해 기존 스크립트의 업로드 경로에 맞춘다.

      - name: Run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LAB_SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.LAB_SSH_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -e
            # 업로드한 같은 커밋의 스크립트를 실행한다. 실패하면 정리하지 않고 실패를 반환한다.
            sudo -n bash /home/ec2-user/jachwi-lab-${{ github.run_id }}-${{ github.run_attempt }}.sh '${{ github.sha }}' '${{ github.run_id }}-${{ github.run_attempt }}'
            rm -f /home/ec2-user/jachwi-lab-${{ github.run_id }}-${{ github.run_attempt }}.sh

      - name: Record deployment result
        if: always() # 앞 단계가 실패해도 결과 기록을 시도한다.
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          # Actions 실행 Summary에 배포 대상과 결과·실행 시각을 남긴다.
          printf 'SHA: %s\n\nBranch: %s\n\nUTC: %s\n\nResult: %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" "$DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ $DEPLOY_STATUS != success ]]; then
            # 앱 로그를 자동 노출하지 않고 EC2에서 확인할 명령을 안내한다.
            echo 'EC2에서 sudo journalctl -u jachwi-lab.service -n 200 --no-pager 확인. 자동 롤백 없음.' >> "$GITHUB_STEP_SUMMARY"
          fi
