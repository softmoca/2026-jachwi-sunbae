name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/gradle/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 같은 이벤트·ref의 오래된 빌드만 취소한다. 배포 job에는 적용하지 않는다.
    concurrency:
      group: backend-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      # 업로드한 JAR의 보관 번호를 deploy job에 전달한다.
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        working-directory: backend # 이 job의 run 명령은 backend/에서 실행한다.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }} # 이번 CI 실행의 커밋을 가져온다.
          persist-credentials: false # 후속 Git 명령용 GitHub 인증정보를 남기지 않는다.

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build
        env:
          # 기존 Gradle 설정이 이 값을 JAR의 build.commit에 기록한다.
          SOURCE_COMMIT_ID: ${{ github.sha }}
        run: |
          # 배포를 실행하지 않고 셸 문법만 검사한다.
          bash -n lab/deploy.sh
          # 기존 빌드·테스트·병렬 실행·캐시 설정을 유지한다.
          ./gradlew clean build --no-daemon --build-cache --console=plain --init-script ../.github/gradle/backend-ci.init.gradle

      - name: Upload lab JAR
        id: artifact
        # 개인 Fork의 develop push 또는 브랜치 수동 실행만 배포용 JAR를 보관한다.
        if: >-
          github.repository == 'softmoca/2026-jachwi-sunbae' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
           (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'))
        uses: actions/upload-artifact@v7
        with:
          # 재실행해도 이름이 충돌하지 않도록 커밋과 시도 번호를 붙인다.
          name: lab-jar-${{ github.sha }}-${{ github.run_attempt }}
          # 실행 JAR만 포함하고 실행용이 아닌 plain JAR는 제외한다.
          path: |
            backend/build/libs/*.jar
            !backend/build/libs/*-plain.jar
          if-no-files-found: error # JAR가 없으면 성공으로 넘어가지 않는다.
          compression-level: 0 # 이미 압축된 JAR에 추가 압축 시간을 쓰지 않는다.
          retention-days: 7 # 재배포에 사용할 산출물을 7일간 보관한다.

  deploy:
    name: Deploy lab
    needs: build # CI가 성공해야 배포할 수 있다.
    # PR·main push·다른 저장소를 제외하고 이번 빌드의 산출물이 있는지 확인한다.
    if: >-
      needs.build.outputs.artifact-id != '' &&
      github.repository == 'softmoca/2026-jachwi-sunbae' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 연결·재시작이 멈춰도 job을 무한히 유지하지 않는다.
    concurrency:
      # 모든 브랜치가 같은 EC2를 사용하므로 동시에 하나만 배포한다.
      group: jachwi-personal-lab-deploy
      cancel-in-progress: false # 진행 중 배포는 유지한다. 기본 대기 1개는 새 요청으로 대체될 수 있다.
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          # 별도 runner에서도 빌드와 같은 커밋의 배포 스크립트를 사용한다.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified JAR
        uses: actions/download-artifact@v8
        with:
          # 새로 빌드하지 않고 build job이 올린 바로 그 JAR를 받는다.
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: lab-artifact

      - name: Deploy over verified SSH
        # SSH 비밀값은 배포 단계에만 전달한다.
        env:
          LAB_SSH_HOST: ${{ secrets.LAB_SSH_HOST }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_SSH_KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          # 호스트 형식과 배포할 JAR가 정확히 하나인지 확인한다.
          [[ $LAB_SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          jars=(lab-artifact/*.jar)
          [[ ${#jars[@]} -eq 1 && -f ${jars[0]} ]] || exit 1
          umask 077 # 새 파일을 현재 사용자만 읽고 쓸 수 있게 만든다.
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT # 성공·실패 종료 시 임시 키 파일을 삭제한다.
          # SSH가 읽을 파일로 만들고 자식 프로세스에 넘길 환경변수에서는 제거한다.
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          unset LAB_SSH_PRIVATE_KEY LAB_SSH_KNOWN_HOSTS
          ssh_options=(-F /dev/null -i "$key_dir/key" # 기본 SSH 설정 대신 배포 키를 사용한다.
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes # 입력 대기 없이 키 인증·서버 신원을 확인한다.
            -o HostKeyAlias=jachwi-lab -o "UserKnownHostsFile=$key_dir/known_hosts" # Secret의 jachwi-lab 호스트 키와 대조한다.
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 # 전역 호스트 목록을 제외하고 연결은 15초까지만 기다린다.
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3) # 응답 없는 연결을 감지한다.
          target="ec2-user@$LAB_SSH_HOST"
          # 실행·시도 번호별 업로드 파일로 충돌을 피한다.
          run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp "${ssh_options[@]}" "${jars[0]}" "$target:/home/ec2-user/jachwi-lab-$run.jar"
          # -n: sudo 입력 대기 금지, -s: 표준입력으로 스크립트 수신, %q: 셸 인자 인용.
          printf -v remote_command 'sudo -n bash -s -- %q %q' "$GITHUB_SHA" "$run"
          # 로컬에서 인용한 명령과 deploy.sh 내용을 EC2에 보내 실행한다.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$remote_command" < backend/lab/deploy.sh

      - name: Record deployment result
        if: always() # 앞 단계가 실패해도 결과 기록을 시도한다.
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          # Actions 실행 Summary에 배포 대상과 결과·실행 시각을 남긴다.
          printf 'SHA: %s\n\nBranch: %s\n\nUTC: %s\n\nResult: %s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" "$DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ $DEPLOY_STATUS != success ]]; then
            # 앱 로그를 자동 노출하지 않고 EC2에서 확인할 명령을 안내한다.
            echo 'EC2에서 sudo journalctl -u jachwi-lab.service -n 200 --no-pager 확인. 자동 롤백 없음.' >> "$GITHUB_STEP_SUMMARY"
          fi
