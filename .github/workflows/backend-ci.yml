name: Backend CI

on:
  # PR 생성·추가 커밋·재오픈 때만 검사한다. push·수동 배포는 CD가 담당한다.
  pull_request:
    paths:
      - "backend/**"
      - ".github/gradle/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 같은 PR의 오래된 빌드만 취소한다. CD는 별도 워크플로에서 직렬 실행한다.
    concurrency:
      group: backend-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend # 이 job의 run 명령은 backend/에서 실행한다.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }} # 이번 CI 실행의 커밋을 가져온다.
          persist-credentials: false # 후속 Git 명령용 GitHub 인증정보를 남기지 않는다.

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build
        env:
          # 기존 Gradle 설정이 이 값을 JAR의 build.commit에 기록한다.
          SOURCE_COMMIT_ID: ${{ github.sha }}
        run: |
          # 배포를 실행하지 않고 셸 문법만 검사한다.
          bash -n lab/deploy.sh
          # 앱을 빌드하고 property 테스트만 실행한다. 2개 JVM·캐시 설정을 유지한다.
          ./gradlew clean build --no-daemon --build-cache --console=plain --init-script ../.github/gradle/backend-ci.init.gradle
