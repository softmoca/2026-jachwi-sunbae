name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          BUILD_FILES="$(grep -Ev '^backend/(docs/|[^/]+\.md$)' <<< "${CHANGED_FILES}" || true)"
          if grep -Eq '^(backend/|\.github/workflows/backend-ci\.yml$)' <<< "${BUILD_FILES}"; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "backend=false" >> "${GITHUB_OUTPUT}"
          fi
        working-directory: .

      - name: Report skipped backend check
        if: steps.changes.outputs.backend != 'true'
        run: echo "빌드에 영향을 주는 백엔드 변경이 없어 검사를 생략한다."
        working-directory: .

      - name: Set up Java
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle dependencies
        if: steps.changes.outputs.backend == 'true'
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: backend-gradle-v1-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/**/gradle.properties', 'backend/gradle/**/*.toml') }}
          restore-keys: |
            backend-gradle-v1-${{ runner.os }}-${{ runner.arch }}-java21-

      - name: Set up Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external

      - name: Build
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew clean build --no-daemon

      - name: Save Gradle dependencies
        if: >-
          steps.changes.outputs.backend == 'true' &&
          steps.gradle-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
