name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}")"
          else
            CHANGED_FILES="$(git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          BUILD_FILES="$(grep -Ev '^backend/(docs/|[^/]+\.md$)' <<< "${CHANGED_FILES}" || true)"
          if grep -Eq '^(backend/|\.github/gradle/|\.github/workflows/backend-ci\.yml$)' <<< "${BUILD_FILES}"; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "backend=false" >> "${GITHUB_OUTPUT}"
          fi
        working-directory: .

      - name: Report skipped backend check
        if: steps.changes.outputs.backend != 'true'
        run: echo "빌드에 영향을 주는 백엔드 변경이 없어 검사를 생략한다."
        working-directory: .

      - name: Set up Java
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.changes.outputs.backend == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external

      - name: Detect cache architecture
        if: steps.changes.outputs.backend == 'true'
        id: cache-config
        run: echo "arch=${RUNNER_ARCH,,}" >> "${GITHUB_OUTPUT}"

      - name: Restore Gradle dependencies
        if: steps.changes.outputs.backend == 'true'
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: backend-gradle-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/**/gradle.properties', 'backend/gradle/**/*.toml') }}
          restore-keys: |
            backend-gradle-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-java21-
            setup-java-${{ runner.os }}-${{ steps.cache-config.outputs.arch }}-gradle-

      - name: Restore Gradle task outputs
        if: steps.changes.outputs.backend == 'true'
        id: task-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/backend-gradle-task-cache
          key: backend-gradle-tasks-v1-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/**/gradle.properties', 'backend/gradle/**/*.toml', '.github/gradle/backend-ci.init.gradle') }}-${{ github.sha }}
          restore-keys: |
            backend-gradle-tasks-v1-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/**/gradle.properties', 'backend/gradle/**/*.toml', '.github/gradle/backend-ci.init.gradle') }}-
            backend-gradle-tasks-v1-${{ runner.os }}-${{ runner.arch }}-java21-

      - name: Build
        if: steps.changes.outputs.backend == 'true'
        env:
          CI_GRADLE_BUILD_CACHE: ${{ runner.temp }}/backend-gradle-task-cache
        run: ./gradlew clean build --no-daemon --build-cache --console=plain --init-script ../.github/gradle/backend-ci.init.gradle

      - name: Save Gradle dependencies
        if: >-
          steps.changes.outputs.backend == 'true' &&
          steps.dependencies.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Save Gradle task outputs
        if: >-
          steps.changes.outputs.backend == 'true' &&
          steps.task-cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/backend-gradle-task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
