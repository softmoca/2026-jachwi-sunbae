name: Frontend Mutation

# 뮤테이션 테스트는 오래 걸리고 병합 조건도 아니라서 PR마다 돌리지 않는다.
# - PR: `mutation` 라벨이 붙은 PR에서만 바뀐 로직 파일에 돌린다.
# - 수동: workflow_dispatch로 바뀐 파일만 또는 전체를 고른다.
# - 주 1회: develop 전체에 돌려 점수를 Step Summary에 남긴다.
# Frontend CI와 파일을 나눈 이유는 라벨 이벤트가 lint, test, build까지 다시 돌리지 않게 하기 위해서다.
on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: origin/develop 이후 바뀐 로직 파일만, full: 대상 전체'
        type: choice
        options:
          - changed
          - full
        default: changed
  schedule:
    # 매주 월요일 09:30 KST. schedule은 기본 브랜치(main)의 이 파일로 실행되므로 develop을 직접 체크아웃한다.
    - cron: '30 0 * * 1'

permissions:
  contents: read

concurrency:
  # 같은 PR의 이전 실행을 취소한다. `mutation`이 아닌 라벨 이벤트는 실행 중인 뮤테이션을 취소하지 않도록 따로 묶는다.
  group: >-
    frontend-mutation-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' && github.event.label.name != 'mutation') && github.run_id || 'run' }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:8080
  POSTHOG_PROJECT_TOKEN: ci-example-posthog-token
  POSTHOG_HOST: https://us.i.posthog.com

jobs:
  changed:
    name: Mutation test changed logic
    # 바뀐 로직 파일에만 뮤테이션 테스트를 돌려 살아남은 변이를 리뷰 입력으로 남긴다.
    # 점수는 병합 조건이 아니라서 실패해도 PR을 막지 않는다.
    if: >-
      (github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'mutation')
        && (github.event.action != 'labeled' || github.event.label.name == 'mutation'))
      || (github.event_name == 'workflow_dispatch' && inputs.scope == 'changed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 대상 판정은 의존성 없이 돌아가므로 설치 전에 끝내고, 대상이 없으면 설치도 건너뛴다.
      - name: Detect changed logic files
        id: changes
        env:
          MUTATION_BASE: origin/${{ github.base_ref || 'develop' }}
        run: |
          TARGETS="$(node scripts/mutation-changed.mjs "${MUTATION_BASE}" --list)"
          if [[ -n "${TARGETS}" ]]; then
            echo "logic=true" >> "${GITHUB_OUTPUT}"
            printf '뮤테이션 대상:\n%s\n' "${TARGETS}"
          else
            echo "logic=false" >> "${GITHUB_OUTPUT}"
            echo "바뀐 로직 파일이 없어 뮤테이션 테스트를 생략한다." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up frontend
        if: steps.changes.outputs.logic == 'true'
        uses: ./.github/actions/setup-frontend

      - name: Restore incremental mutation report
        if: steps.changes.outputs.logic == 'true'
        uses: actions/cache@v5
        with:
          path: frontend/reports/mutation/incremental.json
          key: mutation-incremental-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mutation-incremental-${{ github.head_ref || github.ref_name }}-
            mutation-incremental-${{ github.base_ref || 'develop' }}-

      - name: Run mutation tests on changed logic files
        if: steps.changes.outputs.logic == 'true'
        env:
          MUTATION_BASE: origin/${{ github.base_ref || 'develop' }}
        run: node scripts/mutation-changed.mjs "${MUTATION_BASE}" 2>&1 | tee mutation.log

      - name: Write mutation summary
        if: steps.changes.outputs.logic == 'true' && always()
        run: |
          {
            echo "## 뮤테이션 테스트 결과"
            echo
            echo '```text'
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' mutation.log | grep -vE '^\s*$|Mutation testing +\[' | tail -n 120
            echo '```'
            echo
            echo "살아남은 변이는 테스트가 잡지 못한 동작 변경이다. HTML 보고서는 workflow artifacts에서 받을 수 있다."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload mutation report
        if: steps.changes.outputs.logic == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report
          path: frontend/reports/mutation/index.html
          if-no-files-found: ignore

  full:
    name: Mutation test all logic
    # develop 전체 점수를 주 1회 남긴다. 로컬 7 워커 기준 약 100분이 걸려 시간 제한을 넉넉히 둔다.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # 저장한 증분 결과는 develop 대상 PR의 changed job도 이어 쓴다.
      - name: Restore incremental mutation report
        uses: actions/cache@v5
        with:
          path: frontend/reports/mutation/incremental.json
          key: mutation-incremental-${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            mutation-incremental-${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}-

      - name: Run mutation tests on all logic files
        run: npm run test:mutation 2>&1 | tee mutation.log

      - name: Write mutation summary
        if: always()
        run: |
          CLEAN_LOG="$(sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' mutation.log 2>/dev/null || true)"
          {
            echo "## 뮤테이션 테스트 전체 결과"
            echo
            echo "- ref: \`$(git rev-parse --abbrev-ref HEAD)\` (\`$(git rev-parse --short HEAD)\`)"
            echo
            echo "### 전체 점수"
            echo
            echo '```text'
            echo "${CLEAN_LOG}" | grep -E '^\s*File\s*\||^\s*All files\s*\|' | head -n 2
            echo '```'
            echo
            echo "<details><summary>파일별 결과</summary>"
            echo
            echo '```text'
            echo "${CLEAN_LOG}" | grep -E '\|' | tail -n 200
            echo '```'
            echo
            echo "</details>"
            echo
            echo "HTML 보고서는 workflow artifacts에서 받을 수 있다."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-full
          path: frontend/reports/mutation/index.html
          if-no-files-found: ignore
