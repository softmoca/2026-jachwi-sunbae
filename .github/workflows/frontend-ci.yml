name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:8080
  POSTHOG_PROJECT_TOKEN: ci-example-posthog-token
  POSTHOG_HOST: https://us.i.posthog.com

jobs:
  # 변경 감지를 따로 기다리지 않도록 각 job이 처음에 직접 판정한다.
  # 프론트엔드 변경이 없으면 job은 검사 단계만 건너뛰고 성공으로 끝난다.
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check repository version
        run: python3 .github/scripts/check_versions.py

      - name: Check changelog
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 .github/scripts/check_changelog.py "${VERSION}"

  lint:
    name: Lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        uses: ./.github/actions/detect-frontend-changes

      - name: Set up frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-frontend

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.changes.outputs.frontend == 'true'
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        uses: ./.github/actions/detect-frontend-changes

      - name: Set up frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-frontend

      - name: Typecheck
        if: steps.changes.outputs.frontend == 'true'
        run: npm run typecheck

  test:
    name: Test frontend (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 테스트가 가장 긴 job이라 두 runner에 나눠 다른 job과 비슷한 시간에 끝나게 한다.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        uses: ./.github/actions/detect-frontend-changes

      - name: Set up frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-frontend

      - name: Test
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test -- --shard=${{ matrix.shard }}/2

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        uses: ./.github/actions/detect-frontend-changes

      - name: Set up frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-frontend

      # 타입 검사는 typecheck job이 맡으므로 번들만 만든다.
      - name: Build bundle
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build:bundle

  check:
    # 필수 상태 검사 이름이다. 이름을 바꾸면 rulesets의 필수 검사도 같이 바꿔야 한다.
    name: Check frontend
    needs: [versions, lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Collect frontend results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if echo "${RESULTS}" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "프론트엔드 검사를 모두 통과했다."
          else
            echo "::error::실패하거나 취소된 job이 있다."
            exit 1
          fi

