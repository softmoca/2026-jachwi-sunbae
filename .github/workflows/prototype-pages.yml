name: Prototype Pages

on:
  push:
    branches:
      - codex/351-neighborhood-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'softmoca/2026-jachwi-sunbae'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build prototype
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /2026-jachwi-sunbae/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy prototype
        id: deployment
        uses: actions/deploy-pages@v4
