<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>자취선배 방 비교 기록</title>
    <!--
        openhtmltopdf는 CSS 2.1 위주라 flex와 grid를 쓰지 않는다. 가로 배치는 모두 table로 잡는다.
        색과 모서리는 서비스 화면 토큰(frontend/src/app/styles/tokens.styles.ts)에서 가져왔다.
          글자 #212124, 보조 글자 #5f6368, 흐린 글자 #868b94, 선 #eaebed
          카드 바탕 #f1f2f4, 표 머리글 #f3f4f7, 줄무늬 #f9fafb, 가격 #5279d2
          괜찮음 #6b9ae6 / #3f6fc4, 주의 #ef7b7b / #d14d4d, 미확인 #c6c6c6 / #666
    -->
    <style>
        @page {
            size: A4 portrait;
            margin: 14mm 14mm 16mm;
            @bottom-left {
                content: "자취선배 방 비교 기록";
                color: #868b94;
                font-family: NanumGothic, sans-serif;
                font-size: 7.5pt;
            }
            @bottom-right {
                content: counter(page) " / " counter(pages);
                color: #868b94;
                font-family: NanumGothic, sans-serif;
                font-size: 7.5pt;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: #212124;
            font-family: NanumGothic, sans-serif;
            font-size: 9pt;
            line-height: 1.5;
        }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        td, th { padding: 0; vertical-align: top; text-align: left; word-wrap: break-word; }
        p { margin: 0; }

        /* 공통 조각 */
        .chip {
            display: inline-block;
            padding: 0.6mm 2.2mm;
            border-radius: 3mm;
            background: #ffffff;
            color: #5f6368;
            font-size: 7.5pt;
            font-weight: 700;
        }
        .chip.dark { background: #212124; color: #ffffff; }
        .chip.yellow { background: #f5b91e; color: #212124; }
        .section-title {
            margin: 7mm 0 2.5mm;
            font-size: 11.5pt;
            font-weight: 700;
            page-break-after: avoid;
        }
        .section-title .count { margin-left: 1.5mm; color: #868b94; font-size: 9pt; }
        .card {
            padding: 4mm 5mm;
            border: 1px solid #eaebed;
            border-radius: 4mm;
            background: #ffffff;
        }
        .card.filled { border-color: #f1f2f4; background: #f1f2f4; }
        .empty { padding: 4mm 5mm; border-radius: 4mm; background: #f9fafb; color: #868b94; }

        /* 진행 막대와 상태 숫자 */
        .bar { position: relative; overflow: hidden; height: 1.6mm; border-radius: 0.8mm; background: #e3e5e8; font-size: 0; line-height: 0; }
        .bar-fill { position: absolute; top: 0; height: 1.6mm; font-size: 0; line-height: 0; }
        .bar-good { left: 0; background: #6b9ae6; }
        .bar-caution { background: #ef7a7a; }
        .progress-text { margin-top: 1.2mm; font-weight: 700; }
        .counts { margin-top: 0.6mm; font-size: 7.5pt; }
        .counts span { margin-right: 1.8mm; white-space: nowrap; }
        .good { color: #3f6fc4; }
        .caution { color: #d14d4d; }
        .unconfirmed { color: #666666; }
        .not-applied { color: #868b94; }

        /* 표지 */
        .brand td { vertical-align: middle; }
        .brand-logo { width: 11mm; }
        .brand-logo img { width: 9mm; height: 9mm; border-radius: 2.5mm; }
        .brand-name { font-size: 12pt; font-weight: 700; }
        .brand-doc { width: 60mm; color: #868b94; font-size: 8pt; text-align: right; }
        h1 { margin: 9mm 0 2mm; font-size: 22pt; line-height: 1.25; }
        .lead { color: #5f6368; font-size: 9.5pt; }

        /* 본문 폭 182mm에 칸 사이 간격만큼 양옆을 넓혀 카드 바깥선을 본문 선에 맞춘다. */
        .cards { margin: 6mm 0 0 -1.5mm; width: 185mm; border-collapse: separate; border-spacing: 1.5mm 0; }
        .card-slot { padding: 0; }
        .property-card { padding: 0; border-radius: 4mm; background: #f1f2f4; }
        .thumb {
            height: 30mm;
            border-radius: 4mm 4mm 0 0;
            background-color: #e3e5e8;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .thumb.placeholder { background-color: #579bfc; background-size: 22mm 22mm; }
        .card-body { padding: 3mm 3.5mm 3.5mm; }
        .card-name { margin-top: 1.8mm; font-size: 10pt; font-weight: 700; line-height: 1.35; }
        .card-price { margin-top: 1mm; line-height: 1.4; color: #5279d2; font-size: 8pt; font-weight: 700; }
        .card-address { margin-top: 0.6mm; color: #868b94; font-size: 7.5pt; }

        .table-card { padding: 1.5mm; border: 1px solid #eaebed; border-radius: 4mm; }
        .compare th, .compare td { padding: 2.4mm 2.5mm; }
        .compare thead th {
            padding-top: 2mm;
            padding-bottom: 2mm;
            background: #f3f4f7;
            color: #212124;
            font-size: 8.5pt;
        }
        .compare thead th.first { border-radius: 2.8mm 0 0 2.8mm; }
        .compare thead th.last { border-radius: 0 2.8mm 2.8mm 0; }
        .compare thead .index { display: block; color: #868b94; font-size: 7pt; }
        .compare .label { width: 22mm; color: #868b94; font-size: 8pt; font-weight: 700; }
        .compare tbody tr.striped td, .compare tbody tr.striped th { background: #f9fafb; }
        .compare tbody tr.stage-row th, .compare tbody tr.stage-row td { border-top: 1px solid #eaebed; }

        /* 매물 쪽 */
        .property { page-break-before: always; }
        .hero { padding: 5mm 6mm; border-radius: 4mm; background: #f1f2f4; }
        .hero td { vertical-align: middle; }
        .hero h2 { margin: 2mm 0 1mm; font-size: 17pt; line-height: 1.3; }
        .hero-price { color: #5279d2; font-size: 10pt; font-weight: 700; }
        .hero-address { margin-top: 0.6mm; color: #5f6368; }
        .hero-thumb { width: 40mm; }
        .hero-thumb .thumb { height: 30mm; border-radius: 3.5mm; }

        .basics th, .basics td { padding: 1.8mm 0; border-top: 1px solid #f1f2f4; }
        .basics tr.first th, .basics tr.first td { border-top: 0; }
        .basics th { width: 30mm; color: #868b94; font-weight: 700; }

        .photos { margin: 0 0 0 -3mm; width: 188mm; border-collapse: separate; border-spacing: 3mm 0; }
        .photo-row { page-break-inside: avoid; }
        .photo-cell { width: 50%; padding-bottom: 4mm; }
        .photo-frame { width: 100%; height: 62mm; border-radius: 4mm; background: #f1f2f4; }
        .photo-frame td { height: 62mm; padding: 2mm; text-align: center; vertical-align: middle; }
        .photo-frame img { max-width: 100%; max-height: 58mm; }
        .photo-label { margin-top: 1.5mm; color: #5f6368; font-size: 8pt; font-weight: 700; }
        .photo-label .chip { margin-left: 1mm; padding: 0.2mm 1.8mm; font-size: 7pt; }

        .memo-text { white-space: pre-wrap; }

        .stage { margin-bottom: 4mm; padding: 0; border: 1px solid #eaebed; border-radius: 4mm; }
        .stage-head { padding: 4mm 5mm 3.5mm; border-radius: 4mm 4mm 0 0; background: #f3f4f7; }
        .stage-head td { vertical-align: middle; }
        .stage-title { margin-top: 1.4mm; font-size: 11pt; font-weight: 700; }
        .stage-title .checklist-name { margin-left: 1.5mm; color: #868b94; font-size: 8.5pt; font-weight: 400; }
        .stage-progress { width: 52mm; }
        .stage-progress .progress-text { margin-top: 1.2mm; font-size: 8pt; text-align: right; }
        .stage-progress .counts { text-align: right; }
        .stage-progress .counts span { margin: 0 0 0 1.8mm; }
        .stage-empty { padding: 4mm 5mm; color: #868b94; }
        .items td { padding: 2.6mm 0; border-top: 1px solid #f1f2f4; }
        .items tr { page-break-inside: avoid; }
        .items .status-cell { width: 22mm; padding-left: 5mm; }
        .items .question-cell { padding-right: 5mm; }
        .status {
            display: inline-block;
            padding: 0.5mm 2mm;
            border-radius: 3mm;
            font-size: 7.5pt;
            font-weight: 700;
        }
        .status.good { background: #e3ecfb; color: #3f6fc4; }
        .status.caution { background: #fde7e7; color: #d14d4d; }
        .status.unconfirmed { background: #f1f2f4; color: #666666; }
        .question { font-weight: 700; }
        .item-memo { margin-top: 1mm; color: #5f6368; font-size: 8pt; white-space: pre-wrap; }
    </style>
</head>
<body>
<section class="cover">
    <table class="brand">
        <tr>
            <td class="brand-logo"><img th:src="${logoSource}" alt="자취선배" /></td>
            <td class="brand-name">자취선배</td>
            <td class="brand-doc">방 비교 기록</td>
        </tr>
    </table>

    <h1>방 비교 기록</h1>
    <p class="lead" th:text="|매물 ${properties.size()}곳에 저장된 기록을 나란히 정리했어요. 점수나 추천 없이 적어 둔 내용만 담았어요.|">
        매물에 저장된 기록을 나란히 정리했어요.
    </p>

    <table class="cards">
        <tr>
            <td class="property-card" th:each="property : ${properties}">
                <div class="thumb" th:if="${property.coverPhoto != null}"
                     th:style="|background-image: url('${property.coverPhoto.source}')|"></div>
                <div class="thumb placeholder" th:if="${property.coverPhoto == null}"
                     th:style="|background-image: url('${logoSource}')|"></div>
                <div class="card-body">
                    <span class="chip" th:text="|매물 ${property.index}|">매물 1</span>
                    <div class="card-name" th:text="${property.name}">매물 이름</div>
                    <div class="card-price">
                        <div th:text="|보증금 ${property.deposit}|">보증금</div>
                        <div th:text="|월세 ${property.monthlyRent}|">월세</div>
                    </div>
                    <div class="card-address" th:text="${property.address}">주소</div>
                </div>
            </td>
            <!-- 매물이 적어도 카드 크기가 4곳일 때와 같도록 빈 칸을 채운다. -->
            <td class="card-slot" th:if="${properties.size() < 4}"
                th:each="slot : ${#numbers.sequence(properties.size() + 1, 4)}"></td>
        </tr>
    </table>

    <div class="section-title">한눈에 비교</div>
    <div class="table-card">
        <table class="compare">
            <thead>
            <tr>
                <th class="label first"></th>
                <th th:each="property, status : ${properties}" th:classappend="${status.last} ? 'last'">
                    <span class="index" th:text="|매물 ${property.index}|">매물 1</span>
                    <span th:text="${property.name}">매물 이름</span>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, status : ${overviewRows}" th:classappend="${status.odd} ? '' : 'striped'">
                <th class="label" th:text="${row.label}">구분</th>
                <td th:each="value : ${row.values}" th:text="${value}">내용</td>
            </tr>
            <tr class="stage-row" th:each="row : ${stageRows}">
                <th class="label" th:text="${row.label}">단계</th>
                <td th:each="progress : ${row.values}">
                    <div th:if="${progress.applied}">
                        <div class="bar">
                            <div class="bar-fill bar-good" th:if="${progress.goodCount > 0}"
                                 th:style="|width: ${progress.goodPercent()}%|"></div>
                            <div class="bar-fill bar-caution" th:if="${progress.cautionCount > 0}"
                                 th:style="|left: ${progress.goodPercent()}%; width: ${progress.cautionPercent()}%|"></div>
                        </div>
                        <div class="progress-text" th:text="|${progress.completedCount}/${progress.totalCount} 확인|">0/0 확인</div>
                        <div class="counts">
                            <span class="good" th:text="|괜찮음 ${progress.goodCount}|">괜찮음 0</span>
                            <span class="caution" th:text="|주의 ${progress.cautionCount}|">주의 0</span>
                            <span class="unconfirmed" th:text="|미확인 ${progress.unconfirmedCount}|">미확인 0</span>
                        </div>
                    </div>
                    <span class="not-applied" th:unless="${progress.applied}">적용 안 함</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<section class="property" th:each="property : ${properties}">
    <div class="hero">
        <table>
            <tr>
                <td>
                    <span class="chip dark" th:text="|매물 ${property.index} / ${property.total}|">매물 1 / 1</span>
                    <h2 th:text="${property.name}">매물 이름</h2>
                    <div class="hero-price" th:text="|보증금 ${property.deposit} / 월세 ${property.monthlyRent}|">보증금 / 월세</div>
                    <div class="hero-address" th:text="${property.address}">주소</div>
                </td>
                <td class="hero-thumb">
                    <div class="thumb" th:if="${property.coverPhoto != null}"
                         th:style="|background-image: url('${property.coverPhoto.source}')|"></div>
                    <div class="thumb placeholder" th:if="${property.coverPhoto == null}"
                         th:style="|background-image: url('${logoSource}')|"></div>
                </td>
            </tr>
        </table>
    </div>

    <div class="section-title">기본 정보</div>
    <div class="card">
        <table class="basics">
            <tr th:each="item, status : ${property.basics}" th:classappend="${status.first} ? 'first'">
                <th th:text="${item.label}">항목</th>
                <td th:text="${item.value}">내용</td>
            </tr>
        </table>
    </div>

    <div class="section-title">사진<span class="count" th:text="|${property.photos.size()}장|">0장</span></div>
    <div class="empty" th:if="${property.photos.empty}">저장된 사진이 없어요.</div>
    <table class="photos" th:unless="${property.photos.empty}">
        <tr class="photo-row" th:each="row : ${property.photoRows()}">
            <td class="photo-cell" th:each="photo : ${row}">
                <table class="photo-frame">
                    <tr><td><img th:src="${photo.source}" alt="매물 사진" /></td></tr>
                </table>
                <div class="photo-label">
                    <span th:text="${photo.label}">사진 1</span><span class="chip yellow" th:if="${photo.representative}">대표</span>
                </div>
            </td>
            <td class="photo-cell" th:if="${row.size() == 1}"></td>
        </tr>
    </table>

    <div class="section-title">자유 메모</div>
    <div class="empty" th:if="${property.memo.empty}">저장된 자유 메모가 없어요.</div>
    <div class="card filled memo-text" th:unless="${property.memo.empty}" th:text="${property.memo}">메모</div>

    <div class="section-title">체크리스트</div>
    <div class="stage" th:each="stage : ${property.stages}">
        <div class="stage-head">
            <table>
                <tr>
                    <td>
                        <div class="stage-title">
                            <span th:text="${stage.label}">집에서 확인</span><span class="checklist-name"
                                th:if="${stage.applied()}" th:text="${stage.checklistName}">체크리스트</span>
                        </div>
                    </td>
                    <td class="stage-progress" th:if="${stage.applied()}">
                        <div class="bar">
                            <div class="bar-fill bar-good" th:if="${stage.progress.goodCount > 0}"
                                 th:style="|width: ${stage.progress.goodPercent()}%|"></div>
                            <div class="bar-fill bar-caution" th:if="${stage.progress.cautionCount > 0}"
                                 th:style="|left: ${stage.progress.goodPercent()}%; width: ${stage.progress.cautionPercent()}%|"></div>
                        </div>
                        <div class="progress-text" th:text="|${stage.progress.completedCount}/${stage.progress.totalCount} 확인|">0/0 확인</div>
                        <div class="counts">
                            <span class="good" th:text="|괜찮음 ${stage.progress.goodCount}|">괜찮음 0</span>
                            <span class="caution" th:text="|주의 ${stage.progress.cautionCount}|">주의 0</span>
                            <span class="unconfirmed" th:text="|미확인 ${stage.progress.unconfirmedCount}|">미확인 0</span>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div class="stage-empty" th:unless="${stage.applied()}">이 단계는 이 매물에 적용하지 않았어요.</div>
        <table class="items" th:if="${stage.applied()}">
            <tr th:each="item : ${stage.items}">
                <td class="status-cell"><span class="status" th:classappend="${item.statusClass}" th:text="${item.status}">미확인</span></td>
                <td class="question-cell">
                    <div class="question" th:text="${item.question}">질문</div>
                    <div class="item-memo" th:unless="${item.memo.empty}" th:text="${item.memo}">메모</div>
                </td>
            </tr>
        </table>
    </div>
</section>
</body>
</html>
