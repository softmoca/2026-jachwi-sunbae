spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:jachwi-sunbae-db.c30280sa2kfd.ap-northeast-2.rds.amazonaws.com}:${DB_PORT:3306}/${DB_NAME:jachwi_sunbae}?sslMode=${DB_SSL_MODE:REQUIRED}&connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&preserveInstants=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

auth:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    unlink:
      enabled: false

photo:
  storage:
    region: ap-northeast-2
    bucket: moca-jachwi
    key-prefix: lab/photos/
    # endpoint와 정적 키를 지정하지 않아 기존 DefaultCredentialsProvider를 사용한다.

map:
  provider:
    mode: demo
  nearby:
    provider: demo

promotion:
  collection:
    enabled: false
    seven-eleven:
      enabled: false

delivery-discount:
  notification:
    enabled: false

weather:
  collection:
    enabled: false
  cleanup:
    enabled: false
  notification:
    enabled: false
